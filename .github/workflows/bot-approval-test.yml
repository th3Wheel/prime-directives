name: bot approval test
on:
  pull_request:
    branches: [main]
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr review "$PR" --repo "$REPO" --approve --body "bot approval test"
