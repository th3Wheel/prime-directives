# Fails when .github/workflows/actions.lock is missing, out of sync with the workflows, or a locked pin no longer
# verifies upstream. The lockfile pins every direct and transitive action to a verified commit (github/gh-actions-lock).
#
# To create or fix the lockfile locally, from a checkout of the branch:
#   gh extension install github/gh-actions-lock
#   gh actions-lock            # writes .github/workflows/actions.lock (and may normalize workflow refs)
# To advance moved refs deliberately: gh actions-lock --relock
#
# agent/** is included because PRs that the Open agent PR workflow creates with the default token do not trigger
# pull_request workflows, the same reason ci.yml runs on pushes.
name: Verify actions lock
on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock (pinned release)
        run: gh extension install github/gh-actions-lock --pin v0.1.6
      - name: Verify the lockfile
        run: gh actions-lock --verify
