# CI that still runs for PRs opened by github-actions[bot]: tests with coverage, then SonarCloud analysis.
# SonarCloud runs here (CI-based analysis), not as Automatic Analysis. Settings: sonar-project.properties.
name: CI
on:
  push:
    branches: [main, 'agent/**']  # main for the Sonar baseline; agent pushes (App token pushes DO trigger workflows)
  pull_request:                   # human PRs and later pushes by humans
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    # A push to an agent branch with an open PR fires both events; keep only the push run for agent/** branches.
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # SonarCloud needs full history for blame and new-code detection
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      # --no-build and --no-install-project: nothing runs a build script; tests import from src (pytest pythonpath).
      - name: Install dev dependencies
        run: uv sync --frozen --no-build --no-install-project --project deploy
      - name: Test with coverage
        run: uv run --no-sync --project deploy pytest deploy/tests --cov --cov-report=xml:coverage.xml
      # Pull requests and main only: the free plan has no analysis of other branches. Skipped when the token is
      # absent (Dependabot PRs and forks get no secrets); the required "SonarCloud Code Analysis" check then
      # never reports, so such a PR stays blocked.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: SonarSource/sonarqube-scan-action@v7
