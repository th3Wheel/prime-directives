# When an agent pushes agent/** (incl. gh stack branches), open the PR as a DRAFT from a FIXED template,
# then call the reusable AI reviewer (ai-review.yml), which fills out the checklist in .github/review-rubric.md
# and marks the PR ready only on a clean verdict.
# Agent-written text (commit message, trailer) is only ever shown as quoted, sanitized, length-capped data.
# Enforcement lives outside the agent: this file is on main (CODEOWNERS: Thomas), the App has no Workflows
# permission and (in the hybrid) no Pull requests permission, so the agent can't alter the template or edit the PR.
# The AI review is a comment only. It never approves, and bots are never code owners.
name: Open agent PR
on:
  push:
    branches: ['agent/**']

permissions:
  contents: read

concurrency:
  group: open-agent-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write   # gh pr create / comment / label only; nothing approves
    outputs:
      number: ${{ steps.open.outputs.number }}
    steps:
      - name: Open PR (fixed template) and comment
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PUSHER: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEWER: th3Wheel
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $BRANCH"
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Stacked PRs: base = the closest other agent/** branch whose tip is an ancestor of this commit and
          # not already in main; otherwise main. Works when a stack's branches are pushed at the same time.
          BASE=main; best=999999
          for cand in $(gh api "repos/$REPO/branches?per_page=100" --paginate --jq '.[].name' | grep '^agent/' | grep -vxF "$BRANCH" | head -n 30); do
            csha=$(gh api "repos/$REPO/branches/$cand" --jq .commit.sha 2>/dev/null) || continue
            read -r st ahead < <(gh api "repos/$REPO/compare/$csha...$SHA" --jq '[.status,.ahead_by]|@tsv')
            [ "$st" = ahead ] || continue
            inmain=$(gh api "repos/$REPO/compare/main...$csha" --jq .ahead_by)
            [ "$inmain" -gt 0 ] || continue
            if [ "$ahead" -lt "$best" ]; then best=$ahead; BASE=$cand; fi
          done

          # Sanitize agent text: printable ASCII only, no backticks/tildes (can't break out of the quote block), capped length.
          clean() { LC_ALL=C tr -cd '[:print:]\n' | tr -d '`~' | cut -c1-"$1"; }

          msg=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.message)
          headline=$(printf '%s\n' "$msg" | head -n1 | clean 72)
          [ -n "$headline" ] || headline="(no commit message)"
          summary=$(printf '%s\n' "$msg" | tail -n +3 | grep -v '^Agent-Session:' | head -n 30 | clean 1500 || true)
          session=$(printf '%s\n' "$msg" | sed -n 's/^Agent-Session:[[:space:]]*//p' | tail -n1)
          if printf '%s' "$session" | grep -Eq '^[A-Za-z0-9:/._#-]{1,200}$'; then session_txt="\`$session\`"
          else session_txt="_missing or invalid (expected an \`Agent-Session:\` commit trailer)_"; fi

          stat=$(gh api "repos/$REPO/compare/$BASE...$SHA" \
                   --jq '"\(.ahead_by) commit(s), \(.files | length) file(s), +\([.files[].additions]|add // 0) -\([.files[].deletions]|add // 0)"')

          title="[agent] $headline"
          body=$(cat <<BODY
          ## Agent change

          | | |
          |---|---|
          | Branch | \`$BRANCH\` |
          | Base | \`$BASE\` |
          | Pushed by | \`$PUSHER\` |
          | Head commit | \`${SHA:0:12}\` |
          | Size | $stat |
          | Session | $session_txt |
          | Opened by | [workflow run]($RUN_URL) |

          ### Agent's description (quoted, unverified)
          ~~~text
          ${summary:-(none provided)}
          ~~~

          ## Rollback

          Revert the squash commit unless the description says otherwise.

          ## Pull Request Review Checklist

          An AI reviewer fills out the sections below Human Oversight in a comment before human review (see .github/review-rubric.md). The PR is marked ready when its verdict is clean.

          ### Agent Metadata

          #### Author Type

          - [ ] Human-authored
          - [ ] AI-assisted
          - [x] Agent-generated

          #### Agent Information

          | Field | Value |
          |---------|---------|
          | Agent Name | \`$PUSHER\` |
          | Model | |
          | Workflow | \`Open agent PR\` |
          | Run ID | \`$RUN_ID\` |
          | Task Source | |
          | Issue / Ticket | |

          #### Human Oversight

          - [ ] Human reviewed implementation.
          - [ ] Human reviewed tests.
          - [ ] Human reviewed production risks.
          - [ ] Human authorized merge readiness.

          ### Functionality
          - [ ] Meets requirements
          - [ ] Handles expected edge cases
          - [ ] No obvious bugs introduced
          - [ ] One concern per PR, with no unrelated changes

          ### Code Quality
          - [ ] Code is readable and maintainable
          - [ ] Naming is clear and consistent
          - [ ] No unnecessary complexity or duplication
          - [ ] Linters, formatters and type checks pass with no new warnings

          ### Testing
          - [ ] Relevant tests added or updated
          - [ ] All tests pass
          - [ ] Changes verified manually if needed
          - [ ] CI is green on the current head commit

          ### Security & Performance
          - [ ] No secrets, credentials, or sensitive data committed
          - [ ] Input validation and error handling reviewed
          - [ ] No significant performance regressions
          - [ ] No changes to workflows, rulesets, CODEOWNERS or permissions that aren't called out
          - [ ] New dependencies are justified, pinned, in the lockfile, and under acceptable licenses

          ### Documentation
          - [ ] PR description clearly explains the change
          - [ ] PR description has all required information (ticket or issue number, references) and covers every change in the diff, with no hidden changes
          - [ ] Documentation/comments updated if needed
          - [ ] Breaking changes are identified
          - [ ] How to roll back is clear, with migration notes if needed

          ### Review Items
          - [ ] Every review comment, including Copilot overview-only notes, is fixed or answered

          ### Reproducibility
          - [ ] If another AI agent inherited this repository tomorrow with no additional context, it would make the same decision and produce the same outcome

          ### Reviewer Sign-Off

          - [ ] Functionality reviewed.
          - [ ] Testing reviewed.
          - [ ] Security reviewed.
          - [ ] Production risks reviewed.
          - [ ] Safe to merge.

          ### Merge Decision

          - [ ] ✅ Approve
          - [ ] 🔄 Approve with comments
          - [ ] ❌ Request changes

          Merges only with approval from @$REVIEWER (squash). If Base is not main, this PR is part of a stack: merge from the bottom up.
          BODY
          )
          url=$(gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
                  --title "$title" --body "$body" --reviewer "$REVIEWER" --draft)
          num=${url##*/}
          echo "number=$num" >> "$GITHUB_OUTPUT"
          gh label create agent --repo "$REPO" --color 5319e7 --description "Opened for an agent push" 2>/dev/null || true
          gh pr edit "$num" --repo "$REPO" --add-label agent || true
          gh pr comment "$num" --repo "$REPO" --body "Opened by workflow for push \`${SHA:0:12}\` by \`$PUSHER\`. The title, description and this comment are generated by the repo's workflow, not written by the agent. Run: $RUN_URL"

  # Thin caller of the reusable reviewer. The federation IDs live in ai-review.yml as defaults.
  ai-review:
    needs: open-pr
    if: needs.open-pr.outputs.number != ''
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
      id-token: write
    uses: ./.github/workflows/ai-review.yml
    with:
      pr_number: ${{ needs.open-pr.outputs.number }}
      head_sha: ${{ github.sha }}
