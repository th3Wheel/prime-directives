# TEMPORARY test of the Anthropic federation rule. Lives only on the throwaway branch agent/wif-test. Never merge to main.
# Retry 3: also prints the token's claims (payload only, never the signature) to see what the rule is matching against.
name: anthropic-wif-test
on:
  push:
    branches: ['agent/wif-test']
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const keep = ['iss','sub','aud','repository','repository_owner','repository_id','ref','ref_type','event_name','workflow','workflow_ref','job_workflow_ref','runner_environment','actor','environment'];
            const out = {};
            for (const k of keep) if (k in payload) out[k] = payload[k];
            core.info('OIDC claims: ' + JSON.stringify(out, null, 2));
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01Gjb2SQ7ZViDTJ5cVzNET3o",
            "organization_id": "1dff4732-5e9f-44e6-934f-d084b1acbcb5",
            "service_account_id": "svac_019qWa7DqvvFGbgzEGAiTN12",
            "workspace_id": "wrkspc_01JcfaUaA6jpba2m3qGXa9rs"
          }
          JSON
