# SonarCloud CI-based analysis (run by .github/workflows/ci.yml, job `checks`).
# Identity of the SonarCloud project. Change these two lines if the repo or org moves.
sonar.organization=th3wheel
sonar.projectKey=th3Wheel_prime-directives2

# Everything we author: the Python tool, the shell scripts and the workflows.
sonar.sources=deploy/src,.github
sonar.tests=deploy/tests
sonar.exclusions=**/.venv/**,**/uv.lock

# Cobertura XML from `pytest --cov`, written at the repo root by the CI job.
sonar.python.coverage.reportPaths=coverage.xml
